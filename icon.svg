<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a3e"/>
      <stop offset="100%" style="stop-color:#0a0a1f"/>
    </linearGradient>
    <linearGradient id="ball" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#90d0ff"/>
      <stop offset="100%" style="stop-color:#3080ff"/>
    </linearGradient>
    <linearGradient id="brick1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff3333"/>
    </linearGradient>
    <linearGradient id="brick2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
    <linearGradient id="brick3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#26de81"/>
      <stop offset="100%" style="stop-color:#0be881"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>
  <!-- Bricks -->
  <rect x="14" y="20" width="50" height="40" rx="8" fill="url(#brick1)"/>
  <rect x="71" y="20" width="50" height="40" rx="8" fill="url(#brick2)"/>
  <rect x="128" y="20" width="50" height="40" rx="8" fill="url(#brick3)"/>
  <rect x="14" y="68" width="50" height="40" rx="8" fill="url(#brick2)"/>
  <rect x="71" y="68" width="50" height="40" rx="8" fill="url(#brick3)"/>
  <rect x="128" y="68" width="50" height="40" rx="8" fill="url(#brick1)"/>
  <!-- Shine on bricks -->
  <rect x="14" y="20" width="50" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="71" y="20" width="50" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="128" y="20" width="50" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <!-- Aim line -->
  <line x1="96" y1="175" x2="96" y2="130" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-dasharray="6,5"/>
  <!-- Ball -->
  <circle cx="96" cy="162" r="16" fill="url(#ball)"/>
  <circle cx="96" cy="162" r="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
</svg>
